name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Test
        run: python -m pytest
      - name: Offline prefix replay
        run: python examples/cache_replay.py
      - name: Build sdist and wheel
        run: python -m build --outdir dist
      - name: Install wheel outside editable source
        shell: pwsh
        run: |
          python -m pip uninstall -y mini-claude-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/mini_claude_code-*.whl | Select-Object -First 1).FullName
          python -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          mycc --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mycc --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mycc-usage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
