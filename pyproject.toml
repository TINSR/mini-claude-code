[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-claude-code"
version = "0.1.0"
description = "A Claude Code-style coding agent built from scratch for learning and experimentation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "TIM" },
]
dependencies = [
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build>=1.0",
]

[project.urls]
Repository = "https://github.com/TINSR/mini-claude-code"
Issues = "https://github.com/TINSR/mini-claude-code/issues"

[project.scripts]
mini-claude-code = "mini_claude_code.cli:main"
mycc = "mini_claude_code.cli:main"
mycc-usage = "mini_claude_code.usage_report:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_claude_code"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/skills", "/mcp_servers",
  "/README.md", "/README.en.md", "/LICENSE", "/CHANGELOG.md",
  "/CONTRIBUTING.md", "/SECURITY.md", "/pyproject.toml", "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
